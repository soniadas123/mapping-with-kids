<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="A code window with print Hello world, an arrow, and a map">
  <!-- code window -->
  <rect x="10" y="40" width="250" height="120" rx="10" fill="#111827"/>
  <circle cx="30" cy="58" r="5" fill="#dc2626"/>
  <circle cx="46" cy="58" r="5" fill="#d97706"/>
  <circle cx="62" cy="58" r="5" fill="#059669"/>
  <text x="28" y="112" font-family="Consolas, monospace" font-size="19">
    <tspan fill="#fde047">print</tspan><tspan fill="#ffffff">(</tspan><tspan fill="#86efac">"Hello, world!"</tspan><tspan fill="#ffffff">)</tspan>
  </text>
  <!-- arrow -->
  <path d="M275 100 L315 100 M305 92 L315 100 L305 108" stroke="#2563eb" stroke-width="3" fill="none"/>
  <!-- map -->
  <rect x="330" y="30" width="180" height="140" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <path d="M375 30 L380 170 M450 30 L455 170 M330 70 L510 66 M330 130 L510 134" stroke="#ffffff" stroke-width="8" fill="none"/>
  <circle cx="352" cy="50" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="415" cy="100" rx="24" ry="14" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="470" y="85" width="26" height="26" rx="3" fill="#99f6e4" stroke="#059669" stroke-width="2"/>
</svg>
