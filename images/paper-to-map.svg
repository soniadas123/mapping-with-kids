<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="A hand-drawn paper map, an arrow, and the same map as a digital map">
  <!-- paper map, slightly tilted -->
  <g transform="rotate(-3 110 100)">
    <rect x="20" y="20" width="180" height="160" fill="#ffffff" stroke="#111827" stroke-width="2"/>
    <rect x="26" y="26" width="8" height="8" fill="#111827"/>
    <rect x="186" y="26" width="8" height="8" fill="#111827"/>
    <rect x="26" y="166" width="8" height="8" fill="#111827"/>
    <rect x="186" y="166" width="8" height="8" fill="#111827"/>
    <path d="M70 20 L80 180 M140 20 L150 180 M20 70 L200 60 M20 130 L200 125" stroke="#d1d5db" stroke-width="7" fill="none"/>
    <path d="M30 105 Q80 90 120 110 T195 95" stroke="#2563eb" stroke-width="3" fill="none"/>
    <ellipse cx="110" cy="92" rx="20" ry="12" fill="none" stroke="#059669" stroke-width="3"/>
    <circle cx="165" cy="45" r="9" fill="none" stroke="#dc2626" stroke-width="3"/>
    <path d="M85 155 L130 150" stroke="#111827" stroke-width="3"/>
  </g>
  <!-- arrow -->
  <path d="M232 100 L282 100 M272 92 L282 100 L272 108" stroke="#111827" stroke-width="3" fill="none"/>
  <!-- digital map -->
  <rect x="310" y="20" width="190" height="160" rx="8" fill="#dbeafe" stroke="#111827" stroke-width="2"/>
  <path d="M360 20 L365 180 M435 20 L440 180 M310 70 L500 65 M310 130 L500 128" stroke="#ffffff" stroke-width="8" fill="none"/>
  <path d="M312 105 Q360 90 400 110 T498 95" stroke="#2563eb" stroke-width="3" fill="none"/>
  <ellipse cx="398" cy="92" rx="20" ry="12" fill="#5eead4" fill-opacity="0.6" stroke="#059669" stroke-width="2"/>
  <circle cx="460" cy="45" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <path d="M375 155 L420 152" stroke="#111827" stroke-width="3"/>
</svg>
